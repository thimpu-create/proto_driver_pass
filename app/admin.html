<!DOCTYPE html>
<html>
<head>
    <title>Redis Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3f8;
            padding: 20px;
        }
        h1 { color: #2c3e50; }
        #keys {
            background: white;
            padding: 15px;
            border-radius: 8px;
            width: 300px;
            height: 90vh;
            overflow-y: auto;
            float: left;
        }
        #data {
            margin-left: 320px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            height: 90vh;
            overflow-y: auto;
        }
        .key_item {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }
        .key_item:hover {
            background: #f0f0f0;
        }
        pre {
            background: #002233;
            color: #00ff99;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<h1>🚦 Redis Admin Panel</h1>

<div id="keys">
    <h3>Redis Keys</h3>
    <div id="key_list"></div>
</div>

<div id="data">
    <h3>Key Data</h3>
    <pre id="key_data">Select a key to view its content</pre>
</div>

<script>
async function loadKeys() {
    const res = await fetch("http://localhost:8000/admin/keys");
    const data = await res.json();

    const list = document.getElementById("key_list");
    list.innerHTML = "";

    data.keys.forEach(k => {
        const div = document.createElement("div");
        div.className = "key_item";
        div.innerText = k;
        div.onclick = () => loadKeyData(k);
        list.appendChild(div);
    });
}

async function loadKeyData(key) {
    const res = await fetch("http://localhost:8000/admin/key/" + key);
    const data = await res.json();
    document.getElementById("key_data").innerText = JSON.stringify(data, null, 4);
}

setInterval(loadKeys, 3000); // refresh every 3 sec
loadKeys();
</script>

</body>
</html>
